<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>傳奇十一人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: floodlit night-match board — sticky tab bar, vertical chalked pitch with free-drag card slots, side panel for tactics */
:root{
  --night:#0a1226; --night2:#111d3b; --panel:#16244a; --panel2:#1c2d5a; --line:#2b3d6e;
  --chalk:#eef2fb; --mute:#95a5cc; --amber:#ffc94a; --turf:#1d6e40; --turf2:#217a47;
  --win:#3fd17f; --draw:#c9d2ea; --loss:#ff6f6f;
  --f-disp:"Saira Condensed","Arial Narrow","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(120% 70% at 50% -10%,#1b2d5c 0%,var(--night) 60%) fixed,var(--night);color:var(--chalk);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,18,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:8px}
.logo b{color:var(--amber)}
.logo small{font-family:var(--f-body);font-size:11px;color:var(--mute);font-weight:500;letter-spacing:.08em}
.coins{margin-left:auto;font-family:var(--f-disp);font-weight:700;font-size:18px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px 2px 8px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--amber) 55%,#a87510);box-shadow:0 0 0 1px #7a540a inset}
nav.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--amber)}
main{padding-block:18px 48px}
h2{font-family:var(--f-disp);font-size:26px;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;font-weight:700}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:#4a62a6}
.btn.pri{background:var(--amber);color:#2a1d00;border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;color:var(--mute)}
.chip[aria-pressed="true"]{color:var(--chalk);border-color:var(--amber);background:var(--panel2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}

/* ---------- cards ---------- */
.card{--c1:#5c6577;--c2:#353c4c;--ink:#f3f5fa;--edge:rgba(255,255,255,.25);position:relative;width:7.2em;aspect-ratio:5/7;border-radius:.7em;background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--ink);padding:.55em .55em .5em;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--edge) inset,0 .3em .8em rgba(0,0,0,.35);user-select:none;flex-shrink:0;max-width:100%}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.c-r{font-family:var(--f-disp);font-weight:800;font-size:2.15em;line-height:.9;font-variant-numeric:tabular-nums}
.c-g{font-family:var(--f-disp);font-weight:800;font-size:.85em;letter-spacing:.04em;padding:.05em .35em;border-radius:.3em;background:rgba(0,0,0,.28)}
.c-pos{font-family:var(--f-disp);font-weight:700;font-size:1em;letter-spacing:.05em;opacity:.9;position:relative}
.c-name{margin-top:auto;font-family:var(--f-disp);font-weight:800;font-size:1.12em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.c-meta{font-size:.68em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.c-nat{position:absolute;right:.55em;bottom:2.55em;font-family:var(--f-disp);font-weight:700;font-size:.8em;opacity:.75}
.g-C{--c1:#68707f;--c2:#3b414e}
.g-R{--c1:#3a7ae0;--c2:#1b3a85}
.g-SR{--c1:#9858e6;--c2:#4b2192}
.g-SSR{--c1:#ffe08a;--c2:#c88b14;--ink:#2b1c00;--edge:rgba(255,246,210,.7)}
.g-SSR .c-g{background:rgba(255,255,255,.35)}
.g-UR{--ink:#1a1030;--edge:rgba(255,255,255,.9);background:conic-gradient(from 210deg at 30% 30%,#ffd1f0,#c7f0ff,#d8ffcf,#fff3b8,#ffc6c6,#e1ccff,#ffd1f0);box-shadow:0 0 0 1px #fff inset,0 0 1.2em rgba(255,214,255,.55),0 .3em .8em rgba(0,0,0,.35)}
.g-UR::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);animation:shine 3.2s linear infinite;pointer-events:none}
.g-UR .c-g{background:#1a1030;color:#fff}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.card.dim{filter:grayscale(1) brightness(.35)}
.card.dim *{visibility:hidden}
.card.dim::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:2.4em;color:#8a95b5;visibility:visible;background:none;animation:none}
.badge{position:absolute;left:50%;transform:translateX(-50%);bottom:-.2em;font-size:.7em;font-weight:900;padding:.1em .5em;border-radius:.4em;white-space:nowrap;z-index:2}
.badge.new{background:var(--amber);color:#2a1d00}
.badge.dup{background:#0b1430;color:var(--mute);border:1px solid var(--line)}

/* ---------- squad ---------- */
.squad{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.squad{grid-template-columns:minmax(0,1fr)}}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--turf) 0 10%,var(--turf2) 10% 20%);box-shadow:0 0 0 2px #0e3c22 inset,0 10px 30px rgba(0,0,0,.4);touch-action:none}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:grab;z-index:2}
.slot.drag{cursor:grabbing;z-index:5}
.slot.drag .card,.slot.drag .empty{transform:scale(1.08)}
.slot .card{font-size:clamp(7px,1.75vw,9.5px)}
.empty{width:clamp(50px,12.6vw,68px);aspect-ratio:5/7;border-radius:6px;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:rgba(255,255,255,.8);background:rgba(0,0,0,.15);font-size:18px}
.stag{font-family:var(--f-disp);font-weight:700;font-size:11px;background:rgba(5,15,10,.75);padding:0 6px;border-radius:4px;white-space:nowrap;line-height:1.5;font-variant-numeric:tabular-nums}
.stag .e1{color:var(--win)}.stag .e2{color:var(--amber)}.stag .e3{color:var(--loss)}
.chem{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--amber);color:#2a1d00;font:800 10px/16px var(--f-disp);text-align:center;z-index:3}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.forms{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--night2);border-radius:8px;padding:8px;text-align:center}
.stat .v{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--night2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber)}
.warn{color:var(--loss);font-size:13px}
.tname{background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--chalk);font:700 16px var(--f-body);width:100%}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6;margin:0}

/* ---------- gacha ---------- */
.banner{position:relative;overflow:hidden;border-radius:14px;padding:22px;background:linear-gradient(120deg,#22155a,#0f2f63 60%,#0b3a4d);border:1px solid var(--line)}
.banner h3{font-family:var(--f-disp);font-size:clamp(28px,6vw,46px);line-height:.95;margin:0 0 8px;letter-spacing:.02em;max-width:14ch}
.banner p{margin:0 0 16px;color:#c6d1f0;max-width:46ch}
.banner .fan{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;font-size:12px;pointer-events:none}
.banner .fan .card{margin-left:-3.2em;transform:rotate(var(--rot)) translateY(var(--ty))}
@media (max-width:640px){.banner .fan{display:none}}
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.rate{background:var(--night2);border-radius:8px;padding:8px 6px;text-align:center}
.rate b{font-family:var(--f-disp);font-size:18px;display:block}
.rate span{font-size:11px;color:var(--mute)}
.pullbtns{display:flex;gap:10px;flex-wrap:wrap}
.pullbtns .btn{padding:12px 20px;font-size:16px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,8,20,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ov[hidden]{display:none!important}
.pullgrid{display:grid;grid-template-columns:repeat(5,auto);gap:14px;justify-content:center;font-size:clamp(9px,2.2vw,14px)}
@media (max-width:520px){.pullgrid{grid-template-columns:repeat(3,auto)}}
.pullgrid.one{grid-template-columns:auto;font-size:22px}
.flip{perspective:800px;position:relative}
.flip .in{position:relative;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .back,.flip .card{backface-visibility:hidden}
.flip .card{transform:rotateY(180deg)}
.flip .back{position:absolute;inset:0;border-radius:.7em;background:repeating-linear-gradient(45deg,#1a2a55 0 6px,#14214a 6px 12px);border:2px solid #34508f;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#5571b5;font-size:1.6em}
.flip.h-SSR .back{box-shadow:0 0 1.4em #ffcf4a;border-color:#ffcf4a}
.flip.h-UR .back{box-shadow:0 0 1.8em #ff9dfc,0 0 .6em #9be9ff;border-color:#fff}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.ovfoot{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- album ---------- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;font-size:12.5px}
.agrid .card{width:100%;cursor:pointer}
.cnt{position:absolute;right:.4em;top:2.1em;font-size:.7em;font-weight:900;background:rgba(0,0,0,.4);color:#fff;border-radius:.3em;padding:0 .3em}
.prog{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--mute)}
.prog b{color:var(--chalk);font-family:var(--f-disp);font-size:17px}
.search{background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--chalk);min-width:0;flex:1 1 160px}

/* modal sheet */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet .sh h3{margin:0;font-family:var(--f-disp);font-size:22px;flex:1;min-width:0}
.sheet .sb{padding:14px 16px;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--night2);border:1px solid transparent;border-radius:10px;padding:6px 10px 6px 6px;text-align:left;width:100%}
.pitem:hover{border-color:#4a62a6}
.pitem .card{font-size:6.6px}
.pitem .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .mt{font-size:12px;color:var(--mute)}
.pitem .ef{font-family:var(--f-disp);font-weight:800;font-size:24px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.pitem .ef small{display:block;font-size:11px;font-family:var(--f-body);font-weight:500}
.pitem.inuse{opacity:.6}
.vers{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;font-size:13px}

/* ---------- league ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.lcard[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.lcard b{font-family:var(--f-disp);font-size:22px}
.lcard span{font-size:12px;color:var(--mute)}
.lay{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lay{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--mute);font-weight:700}
td.tn{text-align:left;font-weight:700}
tr.me td{background:rgba(255,201,74,.1)}
tr.me td.tn{color:var(--amber)}
.nextm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:10px 0 14px}
.nextm .t{font-family:var(--f-disp);font-weight:800;font-size:20px;line-height:1.1}
.nextm .o{font-size:12px;color:var(--mute)}
.vs{font-family:var(--f-disp);font-weight:800;color:var(--amber);font-size:18px}
.res{display:flex;flex-direction:column;gap:4px;font-size:13px}
.res div{display:flex;gap:8px;align-items:center}
.wdl{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font:800 11px var(--f-disp);color:#06121f}
.wdl.W{background:var(--win)}.wdl.D{background:var(--draw)}.wdl.L{background:var(--loss)}
select{background:var(--night2);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}

/* ---------- match ---------- */
.mbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:18px 14px;background:linear-gradient(180deg,#0f1c3d,var(--panel))}
.score .tm{font-family:var(--f-disp);font-weight:800;font-size:clamp(16px,4vw,22px);text-align:center;line-height:1.1;overflow-wrap:anywhere}
.score .sc{font-family:var(--f-disp);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:10px;padding:0 14px 10px}
.clock b{font-family:var(--f-disp);font-size:18px;min-width:3ch;font-variant-numeric:tabular-nums;color:var(--amber)}
.clock .bar{flex:1;margin:0}
.feed{height:230px;overflow:auto;padding:6px 14px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.ev{display:grid;grid-template-columns:3ch auto 1fr;gap:8px;font-size:13px;align-items:baseline;animation:pop .3s ease-out}
.ev .m{font-family:var(--f-disp);font-weight:700;color:var(--mute);text-align:right}
.ev .k{font-size:11px;font-weight:900;padding:0 6px;border-radius:4px;background:var(--night2)}
.ev.goal .k{background:var(--amber);color:#2a1d00}
.ev.away.goal .k{background:var(--loss);color:#2a0606}
.ev.goal{font-weight:700}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.mfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.reward{font-weight:700;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:8px 16px;border-radius:999px;font-weight:700;z-index:80;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.g-UR::after,.ev,.flash.go{animation:none}.flip .in{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="logo">傳奇<b>XI</b><small>FOOTBALL MANAGER</small></div>
      <div class="coins" title="金幣"><span class="coin"></span><span id="coinv">0</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="squad" aria-selected="true">排兵佈陣</button>
      <button role="tab" data-v="gacha" aria-selected="false">抽卡</button>
      <button role="tab" data-v="album" aria-selected="false">卡冊</button>
      <button role="tab" data-v="league" aria-selected="false">聯賽 · 比賽</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="ov" id="ov" hidden></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================== PLAYER DATABASE ==================
   [name, position, nation, [[season, club/team, rating], ...], shortName?]
   Rating > 100 = UR (all-time prime legend, one card each). */
const P=[
['Pelé','ST','BRA',[['1958','Brazil',91],['1962/63','Santos',96],['1970','Brazil',104]]],
['Diego Maradona','CAM','ARG',[['1981','Boca Juniors',86],['1986','Argentina',104],['1989/90','Napoli',98],['1994','Argentina',84]],'Maradona'],
['Johan Cruyff','ST','NED',[['1971/72','Ajax',97],['1974','Netherlands',102],['1977/78','Barcelona',92]],'Cruyff'],
['Alfredo Di Stéfano','ST','ARG',[['1956/57','Real Madrid',101],['1962/63','Real Madrid',90]],'Di Stéfano'],
['Franz Beckenbauer','CB','GER',[['1966','West Germany',88],['1974','West Germany',101],['1977','New York Cosmos',84]],'Beckenbauer'],
['Ronaldo Nazário','ST','BRA',[['1994/95','PSV',89],['1996/97','Barcelona',99],['1997/98','Inter',102],['2002','Brazil',97],['2007/08','AC Milan',80]],'Ronaldo'],
['Zinedine Zidane','CAM','FRA',[['1994/95','Bordeaux',84],['1998','France',98],['2000','France',101],['2002/03','Real Madrid',97],['2006','France',94]],'Zidane'],
['Ronaldinho','LW','BRA',[['2002','Brazil',90],['2005/06','Barcelona',101],['2008/09','AC Milan',84]],'Ronaldinho'],

function oppScorers(name){

  const nc=NATCODE[name];
  let l=CARDS.filter(c=>nc?(c.nat===nc&&/^20(1[8-9]|2)/.test(c.season)):(c.club===name&&/^202/.test(c.season))).filter(c=>LINE[c.pos]!=='G');

/* ================== TEAM EVAL ================== */
function evalTeam(){
  const sl=S.slots.map(s=>({...s,sp:slotPos(s.x,s.y),card:s.c?BYID[s.c]:null}));
  sl.forEach(s=>{
    s.chem=0;
    if(!s.card)return;
    let links=0;
    sl.forEach(o=>{if(o!==s&&o.card){if(o.card.club===s.card.club)links++;if(o.card.nat===s.card.nat)links++;}});
    s.links=links;s.chem=links>=6?3:links>=4?2:links>=2?1:0;
    s.f=fit(s.card.pos,s.sp);
    s.eff=Math.round(s.card.r*s.f)+s.chem;
  });
  const val=s=>s.card?s.eff:25;
  const by=l=>sl.filter(s=>LINE[s.sp]===l);
  const avg=a=>a.length?a.reduce((t,s)=>t+val(s),0)/a.length:null;
  const A=by('A'),M=by('M'),D=by('D'),G=by('G');
  const a=avg(A),m=avg(M),d=avg(D);
  const gk=G.length?Math.max(...G.map(val)):30;
  const mm=m??((a??60)+(d??60))/2;
  const att=(a??mm*.85)*.6+mm*.4+1.2*(A.length-3)+.4*(M.length-3);
  const def=(d??mm*.8)*.5+gk*.25+mm*.25+1.2*(D.length-4)+.4*(M.length-3);
  const ovr=Math.round(sl.reduce((t,s)=>t+val(s),0)/11);
  const warn=[];
  if(!G.length)warn.push('冇龍門！防守會大打折扣');
  if(G.length>1)warn.push('排咗多過一個龍門位');
  if(sl.some(s=>!s.card))warn.push('仲有空位未排人');
  return{sl,att:Math.round(att),def:Math.round(def),mid:Math.round(mm),ovr,gk:Math.round(gk),warn,chem:sl.reduce((t,s)=>t+(s.chem||0),0)};
}

function slotHTML(s,i){
  const e=s.card?(s.f>=1?'e1':s.f>=.9?'e2':'e3'):'';
  return `<div class="slot" data-i="${i}" style="left:${s.x}%;top:${s.y}%">

    <span class="stag">${s.sp}${s.card?` <span class="${e}">${s.eff}</span>`:''}</span></div>`;
}
function applyForm(f){
  const pts=FORMS[f];
  // keep players; re-seat by best fit to new positions
  const cards=S.slots.map(s=>s.c).filter(Boolean);
  S.form=f;S.slots=pts.map(([x,y])=>({x,y,c:null}));
  const sps=S.slots.map(s=>slotPos(s.x,s.y));
  const pairs=[];cards.forEach(c=>sps.forEach((sp,i)=>pairs.push([BYID[c].r*fit(BYID[c].pos,sp),c,i])));
  pairs.sort((a,b)=>b[0]-a[0]);const used=new Set();
  pairs.forEach(([,c,i])=>{if(!used.has(c)&&!S.slots[i].c){S.slots[i].c=c;used.add(c)}});
  save();rSquad();
}
function autoXI(){
  const own=owned();
  if(!own.length){toast('卡冊仲係空嘅，去抽卡先');return}
  const sps=S.slots.map(s=>slotPos(s.x,s.y));
  const pairs=[];own.forEach(c=>sps.forEach((sp,i)=>pairs.push([c.r*fit(c.pos,sp),c,i])));
  pairs.sort((a,b)=>b[0]-a[0]);
  S.slots.forEach(s=>s.c=null);
  const usedP=new Set();
  pairs.forEach(([,c,i])=>{if(!S.slots[i].c&&!usedP.has(c.pi)){S.slots[i].c=c.id;usedP.add(c.pi)}});
  save();rSquad();toast('已自動排好最強陣容');
}
function bindPitch(){
  const pitch=$('#pitch');
  pitch.querySelectorAll('.slot').forEach(el=>{
    el.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      const i=+el.dataset.i,r=pitch.getBoundingClientRect();
      const sx=ev.clientX,sy=ev.clientY;let moved=false;
      el.setPointerCapture(ev.pointerId);
      const mv=e=>{
        if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;
        moved=true;el.classList.add('drag');
        const x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));
        const y=Math.max(5,Math.min(96,(e.clientY-r.top)/r.height*100));
        S.slots[i].x=Math.round(x);S.slots[i].y=Math.round(y);
        el.style.left=x+'%';el.style.top=y+'%';
        el.querySelector('.stag').firstChild.textContent=slotPos(x,y)+' ';
      };
      const up=()=>{
        el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        if(moved){S.form='自訂';save();rSquad()}else openPicker(i);
      };
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    });
  });
}

      <div class="ef" style="color:${f>=1?'var(--win)':f>=.9?'var(--amber)':'var(--loss)'}">${e}<small>${f>=1?'本位':f>=.9?'相近':'非本位'}</small></div></button>`}).join(''):`<p class="hint">未有合適球員。去「抽卡」抽多啲啦。</p>`;

/* ---------- GACHA ---------- */
const RATES=[['UR',0.6],['SSR',4],['SR',14],['R',33],['C',48.4]];
function rollGrade(guar){
  const r=Math.random()*100;
  if(guar)return r<3?'UR':r<23?'SSR':'SR';
  let acc=0;for(const[g,p]of RATES){acc+=p;if(r<acc)return g}return'C';
}
function pull(n,free){
  const cost=n===1?100:900;
  if(!free){if(S.coins<cost){toast('金幣唔夠，去踢比賽賺錢');return}S.coins-=cost;}
  const res=[];
  for(let k=0;k<n;k++){
    let g=rollGrade(false);
    if(n===10&&k===9&&!res.some(r=>['SR','SSR','UR'].includes(r.c.g)))g=rollGrade(true);
    const c=rnd(POOL[g]);
    const dup=(S.owned[c.id]||0)>0;
    S.owned[c.id]=(S.owned[c.id]||0)+1;
    if(dup)S.coins+=DUPV[g];
    res.push({c,dup});
  }
  S.stats.pulls+=n;save();setCoins();showPull(res);
}
function showPull(res){
  const ov=$('#ov');ov.hidden=false;
  const top=res.reduce((m,r)=>Math.min(m,GRADES.indexOf(r.c.g)),9);
  ov.innerHTML=`<div class="pullgrid ${res.length===1?'one':''}">${res.map((r,k)=>`<div class="flip h-${r.c.g}" data-k="${k}"><div class="in"><div class="back">XI</div>${cardHTML(r.c,{badge:r.dup?`<span class="badge dup">重複 +${DUPV[r.c.g]}</span>`:`<span class="badge new">NEW</span>`})}</div></div>`).join('')}</div>
  <div class="ovfoot"><button class="btn" id="revall">全部翻開</button><button class="btn pri" id="pagain1">再抽一次</button><button class="btn" id="pdone">完成</button></div>`;
  const flips=[...ov.querySelectorAll('.flip')];
  let t=[];
  flips.forEach((f,k)=>{t.push(setTimeout(()=>reveal(f),450+k*170));f.onclick=()=>reveal(f)});
  function reveal(f){if(f.classList.contains('on'))return;f.classList.add('on');const g=res[+f.dataset.k].c.g;if(g==='UR'||g==='SSR')flash(g)}
  $('#revall').onclick=()=>{t.forEach(clearTimeout);flips.forEach(reveal)};
  $('#pdone').onclick=()=>{t.forEach(clearTimeout);closeOv();render()};
  $('#pagain1').onclick=()=>{t.forEach(clearTimeout);closeOv();pull(res.length)};
}

  <div class="row" style="margin-bottom:14px">
    ${[['ALL','全部位置'],['G','門將'],['D','後衛'],['M','中場'],['A','前鋒']].map(([l,n])=>`<button class="chip" data-l="${l}" aria-pressed="${AF.l===l}">${n}</button>`).join('')}
    <input class="search" id="aq" placeholder="搜尋球員、球會" value="${esc(AF.q)}">
    <button class="chip" id="aall" aria-pressed="${AF.all}">顯示未擁有</button>
  </div>
  <div class="agrid" id="agrid"></div>`;
  const draw=()=>{
    let list=(AF.all?CARDS:own).filter(c=>(AF.g==='ALL'||c.g===AF.g)&&(AF.l==='ALL'||LINE[c.pos]===AF.l)&&(!AF.q||(c.name+c.club+c.short).toLowerCase().includes(AF.q)));
    list=list.slice().sort((a,b)=>b.r-a.r);
    $('#agrid').innerHTML=list.length?list.map(c=>cardHTML(c,{dim:!S.owned[c.id],count:S.owned[c.id]})).join(''):`<p class="hint">未有卡。去「抽卡」開始收集。</p>`;
    $('#agrid').querySelectorAll('.card').forEach(el=>el.onclick=()=>playerSheet(BYID[el.dataset.id].pi));
  };
  draw();
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{AF.g=b.dataset.g;rAlbum()});
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{AF.l=b.dataset.l;rAlbum()});
  $('#aall').onclick=()=>{AF.all=!AF.all;rAlbum()};
  $('#aq').oninput=e=>{AF.q=e.target.value.toLowerCase();draw()};
}
function playerSheet(pi){
  const p=P[pi];const vs=CARDS.filter(c=>c.pi===pi);
  const ov=$('#ov');ov.hidden=false;
  ov.innerHTML=`<div class="sheet" role="dialog"><div class="sh"><h3>${esc(p[0])}</h3><button class="btn" id="pclose">關閉</button></div>
  <div class="sb"><p class="sub">${p[1]} · ${NATN[p[2]]||p[2]} · ${vs.length} 個時期版本</p>
  <div class="vers">${vs.map(c=>`<div style="display:flex;flex-direction:column;gap:6px;align-items:center">${cardHTML(c,{dim:!S.owned[c.id],count:S.owned[c.id]})}<span style="font-size:12px;color:var(--mute)">${c.season}</span></div>`).join('')}</div></div></div>`;
  $('#pclose').onclick=closeOv;ov.onclick=e=>{if(e.target===ov)closeOv()};
}

/* ---------- MATCH ENGINE ---------- */
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
const xg=(a,d)=>Math.max(.15,Math.min(4.5,1.35*Math.exp((a-d)/10)));
function userSide(){const T=evalTeam();return{name:S.team,att:T.att,def:T.def,user:true,T}}
function aiSide(name,ovr,off){const o=ovr+(off||0);return{name,att:o,def:o}}
function scorerUser(T){
  const w={ST:5,LW:3.5,RW:3.5,CAM:3,LM:1.6,RM:1.6,CM:1.4,CDM:.7,LB:.5,RB:.5,CB:.45,GK:.02};
  const ps=T.sl.filter(s=>s.card);if(!ps.length)return'某球員';
  const ws=ps.map(s=>(w[s.sp]||1)*Math.pow(s.eff/80,3));const tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;for(let k=0;k<ps.length;k++){r-=ws[k];if(r<=0)return ps[k].card.short}return ps[0].card.short;
}
function simGoals(h,a){return[poisson(xg(h.att+1.5,a.def)),poisson(xg(a.att,h.def+1.5))]}
function buildEvents(h,a,gh,ga){
  const ev=[];
  const sc=side=>side.user?scorerUser(side.T):rnd(oppScorers(side.name.replace(/^.*?\|/,'')));
  for(let k=0;k<gh;k++)ev.push({m:1+Math.floor(Math.random()*93),side:'h',goal:true,who:sc(h)});
  for(let k=0;k<ga;k++)ev.push({m:1+Math.floor(Math.random()*93),side:'a',goal:true,who:sc(a)});
  const flav=[['黃牌','被罰黃牌'],['中柱','一腳勁射中柱'],['撲救','門將神級撲救'],['越位','入球因越位無效'],['射偏','單刀射偏']];
  const nf=2+Math.floor(Math.random()*4);
  for(let k=0;k<nf;k++){const f=rnd(flav),side=Math.random()<.5?'h':'a';ev.push({m:1+Math.floor(Math.random()*90),side,k:f[0],t:f[1],who:sc(side==='h'?h:a)})}
  return ev.map(e=>({...e,m:Math.min(e.m,90)})).sort((x,y)=>x.m-y.m);
}
let MATCH=null;
function playMatch(h,a,opts,done){
  const[gh,ga]=simGoals(h,a);
  const ev=buildEvents(h,a,gh,ga);
  const ov=$('#ov');ov.hidden=false;
  ov.innerHTML=`<div class="mbox" role="dialog" aria-label="比賽">
    <div style="padding:10px 14px 0" class="lbl">${esc(opts.title||'友誼賽')}</div>
    <div class="score"><div class="tm">${esc(h.name)}</div><div class="sc" id="msc">0 : 0</div><div class="tm">${esc(a.name)}</div></div>
    <div class="clock"><b id="mmin">0'</b><div class="bar"><i id="mbar" style="width:0%"></i></div></div>
    <div class="feed" id="mfeed"></div>
    <div class="mfoot"><span id="mres" class="reward"></span><span class="row"><button class="btn" id="mskip">跳到完場</button><button class="btn pri" id="mdone" hidden>繼續</button></span></div></div>`;
  let min=0,sh=0,sa=0,idx=0;
  const tick=()=>{
    min++;
    while(idx<ev.length&&ev[idx].m<=min){push(ev[idx]);idx++}
    $('#mmin').textContent=min+"'";$('#mbar').style.width=(min/90*100)+'%';
    if(min>=90)end();
  };
  function push(e){
    if(e.goal){e.side==='h'?sh++:sa++;$('#msc').textContent=sh+' : '+sa}
    const team=e.side==='h'?h.name:a.name;
    const d=document.createElement('div');d.className='ev '+(e.side==='a'?'away ':'')+(e.goal?'goal':'');
    d.innerHTML=`<span class="m">${e.m}'</span><span class="k">${e.goal?'入球':e.k}</span><span>${e.goal?`<b>${esc(e.who)}</b>（${esc(team)}）`:`${esc(e.who)}（${esc(team)}）${e.t}`}</span>`;
    const f=$('#mfeed');f.appendChild(d);f.scrollTop=f.scrollHeight;
  }
  const iv=setInterval(tick,55);
  MATCH={iv};
  function end(){
    clearInterval(iv);while(idx<ev.length){push(ev[idx]);idx++}
    $('#mmin').textContent="FT";$('#mbar').style.width='100%';
    const r=done(gh,ga);
    $('#mres').textContent=r||'';
    $('#mskip').hidden=true;$('#mdone').hidden=false;$('#mdone').focus();
  }
  $('#mskip').onclick=()=>{min=89;tick()};
  $('#mdone').onclick=()=>{closeOv();render()};
}
function reward(us,them,mult){
  const res=us>them?'W':us===them?'D':'L';
  const c=Math.round(({W:300,D:120,L:60}[res]+us*20)*mult);
  S.coins+=c;S.stats[res.toLowerCase()]++;save();setCoins();
  return{res,c,txt:`${res==='W'?'贏波':res==='D'?'和波':'輸波'} · +${c} 金幣`};
}

/* ---------- LEAGUE ---------- */
function roundRobin(n){
  const arr=[...Array(n).keys()];if(n%2)arr.push(-1);const m=arr.length,rounds=[];
  for(let r=0;r<m-1;r++){const prs=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a>=0&&b>=0)prs.push(r%2?[b,a]:[a,b])}rounds.push(prs);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}
let LSEL={k:'epl'};
function startLeague(k,diff){
  const L=LEAGUES[k];
  const teams=[{n:S.team,o:0,u:true},...L.teams.map(([n,o])=>({n,o}))];
  S.league={k,diff,teams,rounds:roundRobin(teams.length),round:0,table:teams.map(()=>({p:0,w:0,d:0,l:0,gf:0,ga:0})),log:[]};
  save();rLeague();
}
function rec(L,h,a,gh,ga){
  const th=L.table[h],ta=L.table[a];th.p++;ta.p++;th.gf+=gh;th.ga+=ga;ta.gf+=ga;ta.ga+=gh;
  if(gh>ga){th.w++;ta.l++}else if(gh<ga){ta.w++;th.l++}else{th.d++;ta.d++}
}
const pts=t=>t.w*3+t.d;
function standings(L){return L.teams.map((t,i)=>({...t,i,...L.table[i]})).sort((x,y)=>pts(y)-pts(x)||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf)}
function simAI(L,rd){
  const off=0;
  rd.forEach(([h,a])=>{if(h===0||a===0)return;const H=aiSide(L.teams[h].n,L.teams[h].o),A=aiSide(L.teams[a].n,L.teams[a].o);const[gh,ga]=simGoals(H,A);rec(L,h,a,gh,ga)});
}
function nextRound(){
  const L=S.league;const rd=L.rounds[L.round];
  const fx=rd.find(p=>p.includes(0));
  if(!fx){simAI(L,rd);L.round++;save();toast('今輪你輪空，其他球隊已完成比賽');rLeague();return}
  const T=evalTeam();
  if(T.sl.filter(s=>s.card).length<7){toast('最少要排 7 個球員先可以開波');go('squad');return}
  const off=DIFF[L.diff].o;
  const us=userSide();
  const oi=fx[0]===0?fx[1]:fx[0];const opp=aiSide(L.teams[oi].n,L.teams[oi].o,off);
  const home=fx[0]===0;
  const h=home?us:opp,a=home?opp:us;
  playMatch(h,a,{title:`${LEAGUES[L.k].n} · 第 ${L.round+1} 輪 · ${DIFF[L.diff].n}`},(gh,ga)=>{
    rec(L,fx[0],fx[1],gh,ga);simAI(L,rd);
    const usg=home?gh:ga,them=home?ga:gh;
    const r=reward(usg,them,1);
    L.log.unshift({r:L.round+1,opp:L.teams[oi].n,home,us:usg,them,res:r.res});
    L.round++;
    let extra='';
    if(L.round>=L.rounds.length){const pos=standings(L).findIndex(t=>t.u)+1;const b=[0,3000,1800,1200,800,500,300,200,100,50][pos]||50;const mult={easy:.5,pro:1,world:2}[L.diff];const bonus=Math.round(b*mult);S.coins+=bonus;L.done={pos,bonus};extra=` · 季尾第 ${pos} 名 +${bonus}`}
    save();setCoins();
    return r.txt+extra;
  });
}
function rLeague(){
  const L=S.league;
  const all=Object.entries(LEAGUES).flatMap(([k,l])=>l.teams.map(([n,o])=>({k,n,o,lg:l.n})));
  const friendly=`<div class="panel">
    <div class="lbl" style="margin-bottom:8px">友誼賽 · 任揀對手</div>
    <div class="row"><select id="fopp" aria-label="對手">${Object.entries(LEAGUES).map(([k,l])=>`<optgroup label="${l.n}">${l.teams.map(([n,o])=>`<option value="${esc(n)}|${o}">${esc(n)}（${o}）</option>`).join('')}</optgroup>`).join('')}</select>
    <select id="fdiff" aria-label="難度">${Object.entries(DIFF).map(([k,d])=>`<option value="${k}" ${S.diff===k?'selected':''}>${d.n}</option>`).join('')}</select>
    <button class="btn pri" id="fgo">開波</button></div>
    <p class="hint" style="margin-top:8px">友誼賽獎勵係聯賽一半。</p></div>`;
  if(!L){
    $('#view').innerHTML=`<h2>揀聯賽</h2><p class="sub">你嘅球隊會加入所揀聯賽，主客場雙循環，季尾按名次派金幣。</p>
    <div class="lgrid">${Object.entries(LEAGUES).map(([k,l])=>`<button class="lcard" data-k="${k}" aria-pressed="${LSEL.k===k}"><span>${l.e}</span><b>${l.n}</b><span>${l.teams.slice(0,3).map(t=>esc(t[0])).join('、')}…</span><span>平均評分 ${Math.round(l.teams.reduce((a,t)=>a+t[1],0)/l.teams.length)}</span></button>`).join('')}</div>
    <div class="row" style="margin:16px 0 22px"><span class="lbl">難度</span>${Object.entries(DIFF).map(([k,d])=>`<button class="chip" data-d="${k}" aria-pressed="${S.diff===k}">${d.n}${d.o?`（對手 ${d.o}）`:'（原始評分）'}</button>`).join('')}
    <button class="btn pri" id="lgo">開始賽季</button></div>${friendly}`;
    document.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{LSEL.k=b.dataset.k;rLeague()});
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;save();rLeague()});
    $('#lgo').onclick=()=>startLeague(LSEL.k,S.diff);
  }else{
    L.teams[0].n=S.team;
    const st=standings(L);const fin=L.round>=L.rounds.length;
    let next='';
    if(!fin){
      const fx=L.rounds[L.round].find(p=>p.includes(0));
      if(fx){const oi=fx[0]===0?fx[1]:fx[0];const home=fx[0]===0;const T=evalTeam();const oo=L.teams[oi].o+DIFF[L.diff].o;
        next=`<div class="nextm"><div><div class="t">${esc(home?S.team:L.teams[oi].n)}</div><div class="o">${home?'主場 · 總評 '+T.ovr:'評分 '+oo}</div></div><div class="vs">VS</div><div><div class="t">${esc(home?L.teams[oi].n:S.team)}</div><div class="o">${home?'評分 '+oo:'作客 · 總評 '+T.ovr}</div></div></div>
        <div class="row"><button class="btn pri" id="lnext">開波 · 第 ${L.round+1} 輪</button><button class="btn" onclick="go('squad')">調整陣容</button></div>`}
      else next=`<p class="hint">第 ${L.round+1} 輪你輪空。</p><button class="btn pri" id="lnext">模擬本輪</button>`;
    }else{
      next=`<div style="font-family:var(--f-disp);font-size:30px;font-weight:800;color:var(--amber)">賽季完結 · 第 ${L.done?.pos||st.findIndex(t=>t.u)+1} 名</div><p class="hint">季尾獎金 +${L.done?.bonus||0} 金幣</p>`;
    }
    $('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2>${LEAGUES[L.k].n}</h2><p class="sub" style="margin:0">${DIFF[L.diff].n}難度 · 第 ${Math.min(L.round+1,L.rounds.length)} / ${L.rounds.length} 輪</p></div>
    <span class="row"><button class="btn ${fin?'pri':''}" id="lnew">${fin?'新賽季':'放棄聯賽'}</button></span></div>
    <div class="lay">
      <div class="panel tbl"><table><thead><tr><th>#</th><th style="text-align:left">球隊</th><th>賽</th><th>勝</th><th>和</th><th>負</th><th>入</th><th>失</th><th>球差</th><th>積分</th></tr></thead><tbody>
      ${st.map((t,k)=>`<tr class="${t.u?'me':''}"><td>${k+1}</td><td class="tn">${esc(t.n)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td><td><b>${pts(t)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="side">
        <div class="panel"><div class="lbl">${fin?'結果':'下一場'}</div>${next}</div>
        <div class="panel"><div class="lbl" style="margin-bottom:8px">你嘅賽果</div><div class="res">${L.log.length?L.log.slice(0,10).map(g=>`<div><span class="wdl ${g.res}">${g.res}</span><span style="color:var(--mute)">R${g.r}</span><span>${g.home?'主':'客'} vs ${esc(g.opp)}</span><b style="margin-left:auto;font-family:var(--f-disp)">${g.us} - ${g.them}</b></div>`).join(''):'<span class="hint">未開波</span>'}</div></div>
        ${friendly}
      </div></div>`;
    const ln=$('#lnext');if(ln)ln.onclick=nextRound;
    let armed=false;
    $('#lnew').onclick=e=>{if(fin||armed){S.league=null;save();rLeague()}else{armed=true;e.target.textContent='再撳一次確認放棄';e.target.classList.add('danger')}};
  }
  $('#fgo').onclick=()=>{
    const T=evalTeam();if(T.sl.filter(s=>s.card).length<7){toast('最少要排 7 個球員先可以開波');go('squad');return}
    const[n,o]=$('#fopp').value.split('|');const d=$('#fdiff').value;S.diff=d;save();
    playMatch(userSide(),aiSide(n,+o,DIFF[d].o),{title:`友誼賽 · ${DIFF[d].n}`},(gh,ga)=>reward(gh,ga,.5).txt);
  };
}

/* ================== BOOT ================== */
function boot(d){
  S=(d&&d.slots)?d:(load()||fresh());
  window.claude?.hot?.snapshot?.(()=>S);
  if(!S.starter){
    // starter pack: one SR + a playable squad of R/C
    const need=['GK','CB','CB','LB','RB','CM','CM','CDM','LW','RW','ST','ST','CAM','CB','GK','RM','LM'];
    need.forEach((pos,k)=>{
      const pool=CARDS.filter(c=>(k===0?true:c.g==='C'||c.g==='R')&&(LINE[c.pos]===LINE[pos]));
      const c=k===10?rnd(POOL.SR.filter(c=>LINE[c.pos]==='A')):rnd(pool.filter(c=>c.g!=='SR'&&c.g!=='SSR'&&c.g!=='UR'));
      S.owned[c.id]=(S.owned[c.id]||0)+1;
    });
    S.starter=true;
    // auto XI
    const own=owned();const sps=S.slots.map(s=>slotPos(s.x,s.y));const pairs=[];
    own.forEach(c=>sps.forEach((sp,i)=>pairs.push([c.r*fit(c.pos,sp),c,i])));pairs.sort((a,b)=>b[0]-a[0]);const usedP=new Set();
    pairs.forEach(([,c,i])=>{if(!S.slots[i].c&&!usedP.has(c.pi)){S.slots[i].c=c.id;usedP.add(c.pi)}});
    save();
    setTimeout(()=>toast('送你新手禮包 17 張卡 + 3000 金幣'),400);
  }
  render();
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
